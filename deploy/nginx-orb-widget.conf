# ========================================================
#  浮球挂件 PWA — Nginx 反向代理配置
#  请将此文件内容合并到你的主 Nginx 配置中
# ========================================================
#  两种方式：
#    方式 A（推荐）：include 到主 nginx.conf 的 http{} 块中
#    方式 B：复制到 /etc/nginx/sites-available/ 再 ln -s 到 sites-enabled/
# ========================================================

# ----- 上游服务（Docker 容器） ----- #
upstream orb_backend {
    server orb-widget:3000;
    keepalive 32;
}

# ----- HTTP → HTTPS 重定向（可选，如已有则删除此块） ----- #
# server {
#     listen 80;
#     server_name orb.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

# ----- HTTPS 反向代理 ----- #
server {
    listen 443 ssl;
    server_name orb.yourdomain.com;   # ← 改成你的域名

    # ----- SSL 证书（已有证书直接改路径） ----- #
    ssl_certificate     /etc/nginx/ssl/your-cert.pem;     # ← 改成你的证书路径
    ssl_certificate_key /etc/nginx/ssl/your-cert-key.pem;  # ← 改成你的私钥路径
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ----- 访问日志 & 错误日志 ----- #
    access_log /var/log/nginx/orb-widget-access.log;
    error_log  /var/log/nginx/orb-widget-error.log;

    # ----- 安全头（关键！PWA Service Worker 必须） ----- #
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "no-referrer-when-downgrade" always;

    # PWA 必需头
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # ----- Gzip 压缩 ----- #
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ----- 根路径 ----- #
    location / {
        proxy_pass         http://orb_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection  "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # ----- 静态资源长期缓存（Service Worker 除外） ----- #
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        proxy_pass         http://orb_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        # 静态资源缓存 30 天（manifest 和 sw.js 单独控制）
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ----- manifest.webmanifest 不缓存 ----- #
    location ~* \.webmanifest$ {
        proxy_pass         http://orb_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ----- Service Worker 永不做缓存 ----- #
    location /service-worker.js {
        proxy_pass         http://orb_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # ----- API 健康检查 ----- #
    location /api/ {
        proxy_pass         http://orb_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header Cache-Control "no-store";
    }
}
